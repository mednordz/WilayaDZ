server {
  listen 8080;
  server_name 69.smnc.win;
  root /usr/share/nginx/html;
  index index.html;

  # L'app entière (HTML+CSS+JS+polices+images, tout en base64 inline) tient
  # dans index.html ; sw.js est le seul autre fichier servi. Les deux
  # doivent être revérifiés à chaque visite pour que le service worker
  # applicatif (stale-while-revalidate, voir app/sw.js) voie les mises à
  # jour au lieu de servir une version HTTP-cachée indéfiniment.
  add_header Cache-Control "no-cache" always;

  location = /sw.js {
    default_type application/javascript;
  }
}
