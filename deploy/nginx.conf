server {
  listen 8080;
  server_name wilayadz.smnc.win 69.smnc.win;
  root /usr/share/nginx/html;
  index index.html;

  # L'app entière (HTML+CSS+JS+polices+images, tout en base64 inline) tient
  # dans index.html ; sw.js est le seul autre fichier servi. Les deux
  # doivent être revérifiés à chaque visite pour que le service worker
  # applicatif (stale-while-revalidate, voir app/sw.js) voie les mises à
  # jour au lieu de servir une version HTTP-cachée indéfiniment.
  add_header Cache-Control "no-cache" always;

  location = /sw.js {
    default_type application/javascript;
  }

  # La musique de fond. Ces fichiers ne changent jamais : les faire
  # revalider à chaque lecture, comme le reste du site, ferait repartir
  # une requête conditionnelle sur quinze mégaoctets à chaque ouverture.
  # `add_header` dans un `location` REMPLACE celui hérité du serveur —
  # c'est exactement ce qu'on veut ici, et seulement ici.
  #
  # Les requêtes Range ne sont pas une option : c'est par elles que le
  # navigateur avance dans une piste de quarante minutes sans la
  # télécharger en entier. nginx les sert d'office sur un fichier
  # statique ; la ligne ci-dessous ne fait que le rendre explicite.
  location /media/ {
    # nginx ne connaît ni `.opus` ni `.m4a` comme il faudrait : il servait
    # le premier en `application/octet-stream` — un navigateur strict
    # refuse alors de le lire — et le second en `audio/x-m4a`, une
    # ancienne graphie. Un bloc `types` dans un `location` REMPLACE la
    # table héritée ; ici c'est sans risque, ce dossier ne contient que
    # ces deux fichiers.
    types { audio/ogg opus; audio/mp4 m4a; }
    default_type audio/ogg;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    # Pas d'`Accept-Ranges` écrit à la main : nginx l'envoie déjà sur un
    # fichier statique, et l'ajouter le mettait deux fois dans la réponse.
  }

  # Adresses lisibles, sans « .html » : ce sont elles qui sont declarees a
  # Google et qui circuleront. Les fichiers restent joignables directement.
  location = /confidentialite {
    default_type text/html;
    alias /usr/share/nginx/html/confidentialite.html;
  }
  location = /conditions {
    default_type text/html;
    alias /usr/share/nginx/html/conditions.html;
  }

  # Comptes et synchronisation. Le service Python n'est joignable que
  # d'ici : il n'a pas de `ports:` dans docker-compose.yml, seul le
  # réseau interne le relie à nginx.
  location /api/ {
    # Passer par une variable n'est pas une coquetterie : avec un nom
    # écrit en dur, nginx le résout AU DÉMARRAGE et refuse de démarrer
    # si le conteneur d'API est absent — le site statique tomberait
    # avec lui, alors que toute l'app est justement faite pour
    # fonctionner sans compte. Avec une variable, la résolution a lieu
    # à chaque requête : l'API injoignable donne un 502 sur /api/, et
    # l'app continue de se charger et de marcher hors ligne.
    resolver 127.0.0.11 valid=10s ipv6=off;   # DNS interne de Docker
    set $wilaya_api http://wilaya-api:8090;
    proxy_pass $wilaya_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Une progression complète pèse quelques Kio. Ce plafond arrête un
    # envoi démesuré ici, avant qu'il n'occupe le service applicatif.
    client_max_body_size 1m;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Sans cela la réponse porterait deux en-têtes Cache-Control : celui
    # du service (no-store) et celui du serveur ci-dessus (no-cache).
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
  }
}
