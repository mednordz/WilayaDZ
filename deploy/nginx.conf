server {
  listen 8080;
  server_name wilayadz.smnc.win 69.smnc.win;
  root /usr/share/nginx/html;
  index index.html;

  # L'app entière (HTML+CSS+JS+polices+images, tout en base64 inline) tient
  # dans index.html ; sw.js est le seul autre fichier servi. Les deux
  # doivent être revérifiés à chaque visite pour que le service worker
  # applicatif (stale-while-revalidate, voir app/sw.js) voie les mises à
  # jour au lieu de servir une version HTTP-cachée indéfiniment.
  add_header Cache-Control "no-cache" always;

  location = /sw.js {
    default_type application/javascript;
  }

  # Comptes et synchronisation. Le service Python n'est joignable que
  # d'ici : il n'a pas de `ports:` dans docker-compose.yml, seul le
  # réseau interne le relie à nginx.
  location /api/ {
    proxy_pass http://wilaya-api:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Une progression complète pèse quelques Kio. Ce plafond arrête un
    # envoi démesuré ici, avant qu'il n'occupe le service applicatif.
    client_max_body_size 1m;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Sans cela la réponse porterait deux en-têtes Cache-Control : celui
    # du service (no-store) et celui du serveur ci-dessus (no-cache).
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
  }
}
