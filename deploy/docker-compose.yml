services:
  wilaya-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: wilaya-web
    restart: unless-stopped
    depends_on:
      - wilaya-api
    # Un site statique d'un seul fichier HTML : quelques Mio suffisent
    # largement (nginx:alpine tourne à moins de 10 Mio au repos). Plafond
    # large uniquement pour ne jamais risquer un OOM-kill sur une machine
    # qui fait déjà tourner Ollama, Plex, Immich et la VM Home Assistant.
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # Écoute uniquement sur la boucle locale : c'est le tunnel Cloudflare
    # existant (smnc-portal-tunnel) qui route wilayadz.smnc.win vers ce
    # port, exactement comme wa.smnc.win → 127.0.0.1:8091 (voir DEPLOY.md).
    # 69.smnc.win reste routé vers le même port, pour ne casser aucun lien
    # déjà partagé.
    ports:
      - "127.0.0.1:8099:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Comptes et synchronisation. Volontairement SANS `ports:` : ce service
  # n'est joignable que par wilaya-web, sur le réseau interne de ce
  # fichier. Rien ne l'expose à bigpc, encore moins au tunnel — c'est ce
  # qui rend acceptable d'y faire tourner http.server.
  wilaya-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: wilaya-api
    restart: unless-stopped
    volumes:
      - wilaya-data:/data
    # Adresse fixe : c'est elle, et elle seule, qui est autorisée à
    # remettre du courrier au postfix de bigpc (mynetworks). Sans
    # adresse fixe il faudrait ouvrir tout le sous-réseau Docker, donc
    # aussi n'importe quel futur conteneur qui atterrirait dessus.
    networks:
      default:
        ipv4_address: 172.28.0.10
    # « host-gateway » désigne bigpc vu depuis le conteneur : le postfix
    # qui y tourne déjà relaie vers Gmail (voir DEPLOY.md). Aucun mot de
    # passe à stocker ici — c'est tout l'intérêt de passer par lui.
    extra_hosts:
      - "hote-bigpc:host-gateway"
    environment:
      SMTP_HOST: hote-bigpc
      SMTP_PORT: "25"
      # Le compte sous lequel le relais s'authentifie reellement :
      # un expediteur @smnc.win serait invérifiable (zone sans SPF ni
      # DMARC) et finirait en indesirables.
      MAIL_FROM: "WilayaDZ <bigpc.alg@gmail.com>"
      APP_URL: "https://wilayadz.smnc.win"
      # Identifiant client OAuth du projet Google « WilayaDZ ».
      # Ce n'est PAS un secret : il est public par construction, visible
      # dans l'URL de redirection. Ce qui protège, c'est que le service
      # vérifie que le jeton a bien été émis POUR nous (champ `aud`).
      # Le code secret du client, lui, n'est ni utilisé ni stocké : la
      # redirection rapporte un jeton d'identité, pas un code à échanger.
      GOOGLE_CLIENT_ID: "758547913613-jg0qtlsgi8ekb439diljg1e09ljsb5vk.apps.googleusercontent.com"
    # scrypt réserve ~16 Mio par mot de passe vérifié ; quelques requêtes
    # simultanées tiennent très largement dans 128 Mio.
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/api/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  # Sous-réseau figé pour que l'adresse de wilaya-api ne bouge jamais :
  # elle est inscrite dans le mynetworks du postfix de bigpc, et un
  # changement silencieux couperait l'envoi des courriels.
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  # La base des comptes. C'est la SEULE donnée de tout ce déploiement qui
  # ne se régénère pas depuis le dépôt : à inclure dans les sauvegardes de
  # bigpc, contrairement aux images et aux conteneurs.
  wilaya-data:
