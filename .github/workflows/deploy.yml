name: Déployer le web (69.smnc.win)

# Tourne sur le runner self-hosted de bigpc (voir DEPLOY.md) : c'est la
# seule machine qui héberge le site, il n'y a pas de build à distance.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "deploy/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, bigpc]
    steps:
      - uses: actions/checkout@v4

      - name: Construire et (re)lancer le conteneur
        run: docker compose -f deploy/docker-compose.yml up -d --build

      - name: Attendre que le conteneur soit sain
        run: |
          for i in $(seq 1 15); do
            status=$(docker inspect -f '{{.State.Health.Status}}' wilaya-web 2>/dev/null || echo "starting")
            echo "état : $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "le conteneur n'est jamais devenu sain — logs :" >&2
          docker logs wilaya-web --tail 50
          exit 1
