name: Déployer le web (wilayadz.smnc.win)

# Tourne sur le runner self-hosted de bigpc (voir DEPLOY.md) : c'est la
# seule machine qui héberge le site, il n'y a pas de build à distance.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "deploy/**"
      - "server/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, bigpc]
    steps:
      - uses: actions/checkout@v4

      # Le service de comptes n'a aucune dépendance à installer, mais une
      # faute de frappe dedans ne doit pas être découverte en production :
      # ces tests lancent une instance jetable et l'exercent par HTTP.
      - name: Éprouver le service de comptes
        run: python3 tests/test_api.py

      - name: Construire et (re)lancer les conteneurs
        run: docker compose -f deploy/docker-compose.yml up -d --build

      - name: Attendre que les conteneurs soient sains
        run: |
          for c in wilaya-api wilaya-web; do
            ok=""
            for i in $(seq 1 20); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$c" 2>/dev/null || echo "starting")
              echo "$c : $status"
              if [ "$status" = "healthy" ]; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "$c n'est jamais devenu sain — logs :" >&2
              docker logs "$c" --tail 50
              exit 1
            fi
          done

      # Vérifie la chaîne complète telle qu'un téléphone la voit :
      # nginx doit servir l'app ET router /api vers le service de comptes.
      - name: Vérifier l'app et l'API à travers nginx
        run: |
          page=$(docker exec wilaya-web wget -qO- http://127.0.0.1:8080/ | head -c 400)
          echo "$page" | grep -q "WilayaDZ" || { echo "l'app ne se sert pas" >&2; exit 1; }
          echo "app : ok"

          out=$(docker exec wilaya-web wget -qO- http://127.0.0.1:8080/api/health)
          echo "API : $out"
          echo "$out" | grep -q '"ok"' || { echo "l'API ne répond pas à travers nginx" >&2; exit 1; }

      # La promesse de l'app est qu'elle fonctionne sans compte : le site
      # doit donc rester debout même si le service de comptes est éteint.
      # Sans `resolver` + variable dans nginx.conf, nginx refuserait de
      # démarrer sans lui et emporterait tout le site.
      - name: Vérifier que le site survit à l'arrêt de l'API
        run: |
          docker stop wilaya-api >/dev/null
          docker restart wilaya-web >/dev/null
          sleep 5
          ok=""
          for i in $(seq 1 10); do
            if docker exec wilaya-web wget -qO- http://127.0.0.1:8080/ | grep -q "WilayaDZ"; then ok=1; break; fi
            sleep 2
          done
          docker start wilaya-api >/dev/null
          if [ -z "$ok" ]; then
            echo "le site ne survit pas à l'arrêt du service de comptes" >&2
            docker logs wilaya-web --tail 30
            exit 1
          fi
          echo "le site tient debout sans l'API : ok"
