name: Déployer le web (wilayadz.smnc.win)

# Tourne sur le runner self-hosted de bigpc (voir DEPLOY.md) : c'est la
# seule machine qui héberge le site, il n'y a pas de build à distance.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "deploy/**"
      - "server/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/**"
  workflow_dispatch: {}

concurrency:
  group: wilayadz-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: [self-hosted, bigpc]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer les contrôles de production
        run: sudo -n bash deploy/ops/install.sh
      - name: Publier avec sauvegarde, prévalidation et retour sur échec
        run: python3 deploy/release.py "$GITHUB_SHA"
